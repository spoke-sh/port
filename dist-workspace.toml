[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.30.3"
ci = "github"
installers = ["shell", "homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
install-path = "CARGO_HOME"
hosting = "github"
install-updater = false
pr-run-mode = "plan"
publish-jobs = []
allow-dirty = ["ci"]
include = [
  "RELEASE.md",
  "docs/",
  "examples/",
  "scripts/artifacts/",
  "scripts/install-local-port.sh",
]
