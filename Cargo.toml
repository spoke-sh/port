[workspace]
members = [
  "crates/port-agent-protocol",
  "crates/port-cli",
  "crates/port-model",
  "crates/port-runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.40", features = ["derive", "string", "wrap_help"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
toml = "0.8.23"
