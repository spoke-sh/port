[workspace]
members = [
  "crates/port-agent-protocol",
  "crates/port-cli",
  "crates/port-guest-agent",
  "crates/port-model",
  "crates/port-runtime",
  "crates/port-sdk",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.40", features = ["derive", "string", "wrap_help"] }
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
portable-pty = "0.9.0"
tempfile = "3.23.0"
toml = "0.8.23"
vsock = "0.5.3"
