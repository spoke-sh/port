[artifacts.kernels.demo-kernel]
path = "artifacts/kernel/demo/vmlinux"
build = "port artifacts build --artifact demo-kernel"
validate = "port artifacts validate --artifact demo-kernel"

[artifacts.kernels.demo-kernel.compatibility]
architectures = ["x86_64", "aarch64"]
substrates = ["firecracker"]
protection_modes = ["standard"]

[artifacts.guest_images.demo-guest]
path = "artifacts/guest/demo/rootfs.ext4"
build = "port artifacts build --artifact demo-guest"
validate = "port artifacts validate --artifact demo-guest"

[artifacts.guest_images.demo-guest.compatibility]
architectures = ["x86_64", "aarch64"]
substrates = ["firecracker"]
protection_modes = ["standard"]

[hosts.local]
platform = "linux"
provider = "local"

[hosts.local.connection]
mode = "local"

[hosts.local.firecracker]
local_launch = true
notes = ["Requires /dev/kvm and the firecracker binary"]

[hosts.generic-linux]
platform = "linux"
provider = "generic-linux"

[hosts.generic-linux.connection]
mode = "ssh"
address = "linux.example.internal"
user = "port"
port = 22

[hosts.generic-linux.firecracker]
local_launch = false
notes = ["Remote Linux host reserved for the future cloud/control lane."]

[hosts.aws-linux]
platform = "linux"
provider = "aws"

[hosts.aws-linux.connection]
mode = "ssh"
address = "aws.example.internal"
user = "ec2-user"
port = 22

[hosts.aws-linux.firecracker]
local_launch = false
notes = ["AWS is a justified future Firecracker provider lane for Port."]

[hosts.gcp-linux]
platform = "linux"
provider = "gcp"

[hosts.gcp-linux.connection]
mode = "ssh"
address = "gcp.example.internal"
user = "port"
port = 22

[hosts.gcp-linux.firecracker]
local_launch = false
notes = ["GCP is a justified future Firecracker provider lane for Port."]

[hosts.azure-linux]
platform = "linux"
provider = "azure"

[hosts.azure-linux.connection]
mode = "ssh"
address = "azure.example.internal"
user = "port"
port = 22

[hosts.azure-linux.firecracker]
local_launch = false
notes = ["Azure is modeled explicitly so diagnostics can report it as unsupported."]

[machines.demo]
host = "local"
kernel = "demo-kernel"
guest_image = "demo-guest"
substrate = "firecracker"
protection_mode = "standard"
architecture = "native"
vcpu_count = 2
memory_mib = 512
kernel_args = "console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda rw"
rootfs_read_only = false

[machines.demo.guest]
vsock_cid = 52
control_port = 7000
console_log = "runtime/demo/console.log"

