[artifacts.kernels.demo-kernel]
build = "port artifacts build --artifact demo-kernel"
validate = "port artifacts validate --artifact demo-kernel"

[artifacts.kernels.demo-kernel.reference]
registry = "demo-fs"
repository = "port/demo-kernel"
version = "v1"

[artifacts.kernels.demo-kernel.distribution]
cache_root = ".port/cache"

[artifacts.kernels.demo-kernel.distribution.push]
backend = "file-system"
root = "artifact-store/demo-fs"

[artifacts.kernels.demo-kernel.distribution.pull]
backend = "file-system"
root = "artifact-store/demo-fs"

[[artifacts.kernels.demo-kernel.variants]]
path = "artifacts/kernel/demo/x86_64/firecracker/standard/vmlinux"

[artifacts.kernels.demo-kernel.variants.selector]
architecture = "x86_64"
substrate = "firecracker"
protection_mode = "standard"

[[artifacts.kernels.demo-kernel.variants]]
path = "artifacts/kernel/demo/aarch64/firecracker/standard/vmlinux"

[artifacts.kernels.demo-kernel.variants.selector]
architecture = "aarch64"
substrate = "firecracker"
protection_mode = "standard"

[artifacts.guest_images.demo-guest]
build = "port artifacts build --artifact demo-guest"
validate = "port artifacts validate --artifact demo-guest"

[artifacts.guest_images.demo-guest.reference]
registry = "demo-fs"
repository = "port/demo-guest"
version = "v1"

[artifacts.guest_images.demo-guest.distribution]
cache_root = ".port/cache"

[artifacts.guest_images.demo-guest.distribution.push]
backend = "file-system"
root = "artifact-store/demo-fs"

[artifacts.guest_images.demo-guest.distribution.pull]
backend = "file-system"
root = "artifact-store/demo-fs"

[[artifacts.guest_images.demo-guest.variants]]
path = "artifacts/guest/demo/x86_64/firecracker/standard/rootfs.ext4"

[artifacts.guest_images.demo-guest.variants.selector]
architecture = "x86_64"
substrate = "firecracker"
protection_mode = "standard"

[[artifacts.guest_images.demo-guest.variants]]
path = "artifacts/guest/demo/aarch64/firecracker/standard/rootfs.ext4"

[artifacts.guest_images.demo-guest.variants.selector]
architecture = "aarch64"
substrate = "firecracker"
protection_mode = "standard"

[hosts.local]
platform = "linux"
provider = "local"

[hosts.local.connection]
mode = "local"

[hosts.local.firecracker]
local_launch = true
notes = ["Requires /dev/kvm and the firecracker binary"]

[hosts.generic-linux]
platform = "linux"
provider = "generic-linux"

[hosts.generic-linux.connection]
mode = "ssh"
address = "linux.example.internal"
user = "port"
port = 22

[hosts.generic-linux.firecracker]
local_launch = false
notes = ["Remote Linux host reserved for the future cloud/control lane."]

[hosts.aws-linux]
platform = "linux"
provider = "aws"

[hosts.aws-linux.connection]
mode = "ssh"
address = "aws.example.internal"
user = "ec2-user"
port = 22

[hosts.aws-linux.firecracker]
local_launch = false
notes = ["AWS is a justified future Firecracker provider lane for Port."]

[hosts.gcp-linux]
platform = "linux"
provider = "gcp"

[hosts.gcp-linux.connection]
mode = "ssh"
address = "gcp.example.internal"
user = "port"
port = 22

[hosts.gcp-linux.firecracker]
local_launch = false
notes = ["GCP is a justified future Firecracker provider lane for Port."]

[hosts.azure-linux]
platform = "linux"
provider = "azure"

[hosts.azure-linux.connection]
mode = "ssh"
address = "azure.example.internal"
user = "port"
port = 22

[hosts.azure-linux.firecracker]
local_launch = false
notes = ["Azure is modeled explicitly so diagnostics can report it as unsupported."]

[machines.demo]
host = "local"
kernel = "demo-kernel"
guest_image = "demo-guest"
substrate = "firecracker"
protection_mode = "standard"
architecture = "native"
vcpu_count = 2
memory_mib = 512
kernel_args = "console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda rw"
rootfs_read_only = false

[machines.demo.guest]
vsock_cid = 52
control_port = 7000
console_log = "runtime/demo/console.log"

