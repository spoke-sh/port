[nodes.generic-linux-node]
# Hosted PVM admission example:
#   switching [machines.cloud-generic] to protection_mode = "pvm" should now
#   fail placement because this node only advertises a planned PVM lane.
host = "generic-linux"
runtime_root = "runtime/hosted/generic-linux-node"
notes = ["Generic Linux is the baseline hosted node contract before scheduler policy exists."]

[nodes.generic-linux-node.capabilities]
providers = ["generic-linux"]
platforms = ["linux"]
substrates = ["firecracker"]
architectures = ["x86_64"]
protection_modes = ["standard", "pvm"]

[[nodes.generic-linux-node.capabilities.pvm_lanes]]
architecture = "x86_64"
state = "planned"
notes = ["Generic Linux is modeled as PVM-planned but not host-kit-ready in the sample inventory."]

[nodes.aws-linux-node]
# Hosted PVM admission-ready example:
#   switching [machines.cloud-aws] to protection_mode = "pvm" should pass the
#   hosted placement gate because this node advertises a ready PVM lane and can
#   launch once the host kit and PVM artifact paths are prepared.
host = "aws-linux"
runtime_root = "runtime/hosted/aws-linux-node"
notes = ["AWS stays explicit because later host-group and PVM planning will care about provider identity."]

[nodes.aws-linux-node.capabilities]
providers = ["aws"]
platforms = ["linux"]
substrates = ["firecracker"]
architectures = ["x86_64"]
protection_modes = ["standard", "pvm"]

[[nodes.aws-linux-node.capabilities.pvm_lanes]]
architecture = "x86_64"
state = "ready"
notes = ["AWS is the sample hosted node that represents an x86_64 PVM-prepared host kit."]

[nodes.aws-linux-node.capabilities.pvm_lanes.host_kit]
host_platform = "linux"
host_architecture = "x86_64"
requires_custom_host_kernel = true
requires_patched_firecracker = true
firecracker_binary_name = "firecracker-pvm"
firecracker_binary_env = "PORT_PVM_FIRECRACKER_BINARY"
host_boot_args = ["pti=off"]
notes = [
  "The host kernel must carry the Firecracker/PVM-capable KVM changes rather than stock KVM alone.",
  "The VMM binary must be a PVM-capable Firecracker build, not the current standard lane binary.",
]

[nodes.gcp-linux-node]
host = "gcp-linux"
runtime_root = "runtime/hosted/gcp-linux-node"
notes = ["GCP is modeled as a hosted node so placement and lifecycle work can remain provider-aware."]

[nodes.gcp-linux-node.capabilities]
providers = ["gcp"]
platforms = ["linux"]
substrates = ["firecracker"]
architectures = ["x86_64"]
protection_modes = ["standard", "pvm"]

[[nodes.gcp-linux-node.capabilities.pvm_lanes]]
architecture = "x86_64"
state = "planned"
notes = ["GCP remains modeled as a planned PVM node until a prepared host kit is explicitly advertised."]

[host_groups.remote-linux]
placement = "explicit-membership"
nodes = ["generic-linux-node", "aws-linux-node", "gcp-linux-node"]
notes = ["This group is the first hosted placement boundary; later scheduler, monitoring, and services work should reuse it instead of inventing another inventory axis."]

[host_groups.aws-builders]
placement = "explicit-membership"
nodes = ["aws-linux-node"]
notes = ["Provider-specific groups stay explicit so later scheduling and service placement can target them without creating a second host taxonomy."]

[machines.demo]
# Standard shipped lane:
#   keep this machine on protection_mode = "standard" when you want the real
#   local Firecracker launch proof while PVM remains a gated admission lane.
host = "local"
kernel = "demo-kernel"
guest_image = "demo-guest"
substrate = "firecracker"
protection_mode = "standard"
architecture = "native"
vcpu_count = 2
memory_mib = 512
kernel_args = "console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda rw"
rootfs_read_only = false

[machines.demo.guest]
vsock_cid = 52
control_port = 7000
console_log = "runtime/demo/console.log"

[machines.cloud-generic]
# Hosted denial example:
#   change protection_mode to "pvm" to see Port reject placement because
#   generic-linux-node only advertises state = "planned".
