[artifacts.kernels.demo-kernel]
build = "port artifacts build --artifact demo-kernel"
validate = "port artifacts validate --artifact demo-kernel"

[artifacts.kernels.demo-kernel.reference]
registry = "demo-fs"
repository = "port/demo-kernel"
version = "v1"

[artifacts.kernels.demo-kernel.distribution]
cache_root = ".port/cache"

[artifacts.kernels.demo-kernel.distribution.push]
backend = "file-system"
root = "artifact-store/demo-fs"

[artifacts.kernels.demo-kernel.distribution.pull]
backend = "file-system"
root = "artifact-store/demo-fs"

[[artifacts.kernels.demo-kernel.variants]]
path = "artifacts/kernel/demo/x86_64/firecracker/standard/vmlinux"

[artifacts.kernels.demo-kernel.variants.selector]
architecture = "x86_64"
substrate = "firecracker"
protection_mode = "standard"

[[artifacts.kernels.demo-kernel.variants]]
path = "artifacts/kernel/demo/aarch64/firecracker/standard/vmlinux"

[artifacts.kernels.demo-kernel.variants.selector]
architecture = "aarch64"
substrate = "firecracker"
protection_mode = "standard"

[artifacts.guest_images.demo-guest]
build = "port artifacts build --artifact demo-guest"
validate = "port artifacts validate --artifact demo-guest"

[artifacts.guest_images.demo-guest.reference]
registry = "demo-fs"
repository = "port/demo-guest"
version = "v1"

[artifacts.guest_images.demo-guest.distribution]
cache_root = ".port/cache"

[artifacts.guest_images.demo-guest.distribution.push]
backend = "file-system"
root = "artifact-store/demo-fs"

[artifacts.guest_images.demo-guest.distribution.pull]
backend = "file-system"
root = "artifact-store/demo-fs"

[[artifacts.guest_images.demo-guest.variants]]
path = "artifacts/guest/demo/x86_64/firecracker/standard/rootfs.ext4"

[artifacts.guest_images.demo-guest.variants.selector]
architecture = "x86_64"
substrate = "firecracker"
protection_mode = "standard"

[[artifacts.guest_images.demo-guest.variants]]
path = "artifacts/guest/demo/aarch64/firecracker/standard/rootfs.ext4"

[artifacts.guest_images.demo-guest.variants.selector]
architecture = "aarch64"
substrate = "firecracker"
protection_mode = "standard"

[control_planes.demo]
endpoint = "https://port.example.internal"
audience = "port-hosted-demo"

[control_planes.demo.auth]
scheme = "bearer"
header = "authorization"

[control_planes.demo.auth.source]
kind = "env"
variable = "PORT_DEMO_TOKEN"

[hosts.local]
platform = "linux"
provider = "local"

[hosts.local.connection]
mode = "local"

[hosts.local.firecracker]
local_launch = true
notes = ["Requires /dev/kvm and the firecracker binary"]

[hosts.generic-linux]
platform = "linux"
provider = "generic-linux"

[hosts.generic-linux.connection]
mode = "hosted-control-plane"
control_plane = "demo"

[hosts.generic-linux.firecracker]
local_launch = false
notes = ["Remote Linux host is modeled through the demo hosted control plane contract."]

[hosts.aws-linux]
platform = "linux"
provider = "aws"

[hosts.aws-linux.connection]
mode = "hosted-control-plane"
control_plane = "demo"

[hosts.aws-linux.firecracker]
local_launch = false
notes = ["AWS is a justified future Firecracker provider lane and is modeled through the demo hosted control plane contract."]

[hosts.gcp-linux]
platform = "linux"
provider = "gcp"

[hosts.gcp-linux.connection]
mode = "hosted-control-plane"
control_plane = "demo"

[hosts.gcp-linux.firecracker]
local_launch = false
notes = ["GCP is a justified future Firecracker provider lane and is modeled through the demo hosted control plane contract."]

[hosts.azure-linux]
platform = "linux"
provider = "azure"

[hosts.azure-linux.connection]
mode = "hosted-control-plane"
control_plane = "demo"

[hosts.azure-linux.firecracker]
local_launch = false
notes = ["Azure is modeled explicitly through the demo hosted control plane so diagnostics can report it as unsupported."]

[nodes.generic-linux-node]
host = "generic-linux"
runtime_root = "runtime/hosted/generic-linux-node"
notes = ["Generic Linux is the baseline hosted node contract before scheduler policy exists."]

[nodes.generic-linux-node.capabilities]
providers = ["generic-linux"]
platforms = ["linux"]
substrates = ["firecracker"]
architectures = ["x86_64"]
protection_modes = ["standard"]

[nodes.aws-linux-node]
host = "aws-linux"
runtime_root = "runtime/hosted/aws-linux-node"
notes = ["AWS stays explicit because later host-group and PVM planning will care about provider identity."]

[nodes.aws-linux-node.capabilities]
providers = ["aws"]
platforms = ["linux"]
substrates = ["firecracker"]
architectures = ["x86_64"]
protection_modes = ["standard"]

[nodes.gcp-linux-node]
host = "gcp-linux"
runtime_root = "runtime/hosted/gcp-linux-node"
notes = ["GCP is modeled as a hosted node so placement and lifecycle work can remain provider-aware."]

[nodes.gcp-linux-node.capabilities]
providers = ["gcp"]
platforms = ["linux"]
substrates = ["firecracker"]
architectures = ["x86_64"]
protection_modes = ["standard"]

[host_groups.remote-linux]
placement = "explicit-membership"
nodes = ["generic-linux-node", "aws-linux-node", "gcp-linux-node"]
notes = ["This group is the first hosted placement boundary; later scheduler, monitoring, and services work should reuse it instead of inventing another inventory axis."]

[host_groups.aws-builders]
placement = "explicit-membership"
nodes = ["aws-linux-node"]
notes = ["Provider-specific groups stay explicit so later scheduling and service placement can target them without creating a second host taxonomy."]

[machines.demo]
host = "local"
kernel = "demo-kernel"
guest_image = "demo-guest"
substrate = "firecracker"
protection_mode = "standard"
architecture = "native"
vcpu_count = 2
memory_mib = 512
kernel_args = "console=ttyS0 reboot=k panic=1 pci=off root=/dev/vda rw"
rootfs_read_only = false

[machines.demo.guest]
vsock_cid = 52
control_port = 7000
console_log = "runtime/demo/console.log"

